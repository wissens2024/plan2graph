# Plan2Graph 대시보드 서버 설정 — nginx(plan2graph.aines.kr:443) 리버스프록시 뒤에서 동작.
# CLI 플래그 없이 `streamlit run admin.py`로 띄워도 websocket(403)이 막히지 않도록 여기 고정.
[server]
address = "0.0.0.0"
port = 8501
headless = true
enableCORS = false            # 프록시 origin 허용
enableXsrfProtection = false  # wss://.../_stcore/stream 403 방지

[browser]
gatherUsageStats = false
